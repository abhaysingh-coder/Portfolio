{% extends 'base.html' %}

{% block title %}
Login | Abhay Singh
{% endblock %}

{% block content %}

<section class="login-page">

    <div class="login-card">

        <div class="login-header">

            <div class="login-icon">
                <i class="fa-solid fa-user-shield"></i>
            </div>

            <h1>Welcome Back</h1>

            <p>
                Login to access the Portfolio Admin Panel
            </p>

        </div>

        <form method="POST">

            {% csrf_token %}

            <div class="input-box">
                <i class="fa-solid fa-user"></i>
                <input
                    type="text"
                    name="username"
                    placeholder="Username"
                    required
                >
            </div>

            <div class="input-box">
                <i class="fa-solid fa-lock"></i>
                <input
                    type="password"
                    name="password"
                    placeholder="Password"
                    required
                >
            </div>

            <button type="submit">
                <i class="fa-solid fa-right-to-bracket"></i>
                Login
            </button>

        </form>

    </div>

</section>

{% endblock %}
