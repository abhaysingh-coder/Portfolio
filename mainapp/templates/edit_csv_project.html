{% extends 'base.html' %}

{% block title %}
Edit Project
{% endblock %}

{% block content %}

<section class="csv-form-page">

    <div class="csv-form-card">

        <h1>Edit Project</h1>

        <form method="POST">
            {% csrf_token %}

            <input type="text" name="Name" maxlength="100" value="{{ project.Name }}" required>
            <input type="text" name="Category" maxlength="100" value="{{ project.Category }}" required>

            <textarea name="Description" required>{{ project.Description }}</textarea>

            <textarea name="Detail">{{ project.Detail }}</textarea>

            <input type="url" name="Github" maxlength="200" value="{{ project.Github }}">

            <input type="url" name="Project" maxlength="200" value="{{ project.Project }}">

            <button type="submit">
                Update Project
            </button>
        </form>

    </div>

</section>

{% endblock %}
