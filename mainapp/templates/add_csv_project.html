{% extends 'base.html' %}

{% block title %}
Add Project
{% endblock %}

{% block content %}

<section class="csv-form-page">

    <div class="csv-form-card">

        <h1>Add New Project</h1>

        <form method="POST">
            {% csrf_token %}

            <input type="text" name="Name" placeholder="Project Name" required>
            <input type="text" name="Category" placeholder="Category" required>
            <textarea name="Description" placeholder="Short Description" required></textarea>
            <textarea name="Detail" placeholder="Detailed Description"></textarea>
            <input type="url" name="Github" placeholder="GitHub Link">
            <input type="url" name="Project" placeholder="Live Project Link">

            <button type="submit">
                Save Project
            </button>
        </form>

    </div>

</section>

{% endblock %}
