{% extends 'base.html' %}

{% block title %}
Add Project
{% endblock %}

{% block content %}

<section class="csv-form-page">

    <div class="csv-form-card">

        <h1>Add New Project</h1>

        <form method="POST">
            {% csrf_token %}

            <input type="text" name="Name" maxlength="100" placeholder="Project Name" value="{{ project.Name }}" required>
            <input type="text" name="Category" maxlength="100" placeholder="Category" value="{{ project.Category }}" required>
            <textarea name="Description" placeholder="Short Description" required>{{ project.Description }}</textarea>
            <textarea name="Detail" placeholder="Detailed Description">{{ project.Detail }}</textarea>
            <input type="url" name="Github" maxlength="200" placeholder="GitHub Link" value="{{ project.Github }}">
            <input type="url" name="Project" maxlength="200" placeholder="Live Project Link" value="{{ project.Project }}">

            <button type="submit">
                Save Project
            </button>
        </form>

    </div>

</section>

{% endblock %}
